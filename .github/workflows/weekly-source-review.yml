name: Weekly source review

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-source-review
  cancel-in-progress: false

jobs:
  check-sources:
    if: github.repository == 'ShipOfShame/Academic-Misconduct-Marker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check the monitor
        run: npm run test:monitor

      - name: Locate previous successful snapshot
        id: previous
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'weekly-source-review.yml',
              branch: 'main', status: 'success', per_page: 100
            });
            for (const run of runs) {
              if (run.id === context.runId || !['schedule', 'workflow_dispatch'].includes(run.event)) continue;
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id, per_page: 100
              });
              const artifact = data.artifacts.find(a => a.name === 'source-review' && !a.expired);
              if (artifact) {
                core.setOutput('run-id', String(run.id));
                return;
              }
            }
            core.notice('No retained snapshot found; this run will establish a baseline.');

      - name: Restore previous snapshot and pending reviews
        if: steps.previous.outputs.run-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-review
          path: dist/previous-review
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Check public sources
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ steps.previous.outputs.run-id }}
        run: |
          if [ -n "$PREVIOUS_RUN" ]; then
            npm run monitor -- --previous dist/previous-review/snapshot.json
          else
            npm run monitor
          fi

      - name: Publish review summary
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          if [ -f dist/source-monitor/summary.md ]; then
            cat dist/source-monitor/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save snapshot and pending review list
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-review
          path: |
            dist/source-monitor/snapshot.json
            dist/source-monitor/review.md
          if-no-files-found: error
          retention-days: 90
